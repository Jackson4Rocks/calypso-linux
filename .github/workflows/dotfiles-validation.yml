name: Validate Calypso Hyprland dotfiles

on:
  push:
    paths:
      - "dotfiles/**"
      - ".github/workflows/dotfiles-validation.yml"
  pull_request:
    paths:
      - "dotfiles/**"
      - ".github/workflows/dotfiles-validation.yml"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bash
        run: |
          bash -n dotfiles/scripts/install.sh
          bash -n dotfiles/scripts/calypso-wallpaper
          bash -n dotfiles/scripts/verify.sh

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          theme = json.loads(Path("dotfiles/dms/calypso-expressive.json").read_text())
          required = {
              "primary", "primaryText", "primaryContainer", "secondary",
              "surface", "surfaceText", "surfaceVariant", "surfaceVariantText",
              "surfaceTint", "background", "backgroundText", "outline",
              "surfaceContainerLowest", "surfaceContainerLow",
              "surfaceContainer", "surfaceContainerHigh", "surfaceContainerHighest"
          }
          for mode in ("dark", "light"):
              missing = sorted(required - set(theme.get(mode, {})))
              assert not missing, f"{mode} theme missing: {', '.join(missing)}"
          print("theme JSON + Material 3 color roles: valid")
          PY

      - name: Validate Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p dotfiles/hypr/hyprland.lua

  dms-smoke:
    name: DMS Wayland smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test DankMaterialShell under headless Wayland
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/repo:ro"             archlinux:latest             bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm dms-shell dms-shell-hyprland weston dbus shadow
              useradd --create-home --uid 1000 --shell /bin/bash calypso-ci
              runuser -u calypso-ci -- bash /repo/dotfiles/scripts/ci-dms-smoke.sh
            '
