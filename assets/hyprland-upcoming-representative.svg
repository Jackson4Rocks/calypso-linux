  <title id="title">Calypso Hyprland desktop preview</title>
  <desc id="desc">A high-resolution vector recreation of the supplied Calypso Hyprland desktop screenshot, with a green aurora lake wallpaper and capsule-style Noctalia bar.</desc>
  <defs>
