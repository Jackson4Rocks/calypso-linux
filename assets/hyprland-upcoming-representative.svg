      <stop offset="1" stop-color="#031b14" stop-opacity=".96"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="40"/></filter>
